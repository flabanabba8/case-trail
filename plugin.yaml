name: case-trail
version: "0.4.4"
description: "Trace case-history and treatment research to actual opinion passages; analyze supplied sources without a required repository."
author: "Case Trail contributors"
license: GPL-3.0-or-later
requires_hermes: ">=0.22.3"
provides_tools:
  - caselaw_examine_source
  - caselaw_examine_source_file
  - caselaw_review_sources
  - caselaw_search
  - caselaw_fetch
  - caselaw_examine
  - caselaw_examine_file
  - caselaw_fetch_public_opinion
  - caselaw_examine_public_opinion
  - caselaw_read_public_opinion
  - caselaw_public_opinions
  - caselaw_review
  - caselaw_review_get
  - caselaw_review_check_sources
  - caselaw_review_check_public_sources
  - caselaw_review_render
  - caselaw_reviews
config_schema:
  opinion_folders: {type: str, default: "", description: "Optional comma-separated folders (or a JSON array) that opinion files must live under. Empty = any folder outside the private-configuration denylist. Set by you; the model cannot change it."}
