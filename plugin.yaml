name: case-trail
version: "0.1.0"
description: "A novelty case-law explorer: follow a case's appeals and later treatment with sourced passages. Not legal advice or a citator."
author: "Case Trail contributors"
license: GPL-3.0-or-later
requires_hermes: ">=0.22.0"
provides_tools:
  - caselaw_search
  - caselaw_fetch
  - caselaw_examine
  - caselaw_examine_file
  - caselaw_fetch_public_opinion
  - caselaw_examine_public_opinion
  - caselaw_read_public_opinion
  - caselaw_public_opinions
  - caselaw_review
  - caselaw_review_get
  - caselaw_review_check_sources
  - caselaw_review_check_public_sources
  - caselaw_reviews
